name: Tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install CPU environment
        run: |
          python -m pip install torch==2.9.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[language]'
      - name: Python tests
        run: python -m unittest discover -s tests -q
      - name: JavaScript tests
        run: |
          export LAB_PYTHON="$(command -v python)"
          for test in tests/test_*.cjs; do node "$test"; done
      - name: Rebuild course without private assets
        run: python scripts/export_site.py --output site-check
