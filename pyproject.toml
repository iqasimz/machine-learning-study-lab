[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-training-lab"
version = "0.16.0"
description = "Machine Learning Study Lab: ML, DL, NLP and LLM courses with local experiments"
requires-python = ">=3.11"
dependencies = ["torch>=2.9,<3", "tensorboard>=2.17,<3", "scikit-learn>=1.7,<2", "numpy>=1.26,<3", "joblib>=1.4", "threadpoolctl>=3"]

[project.optional-dependencies]
language = ["transformers>=4.57,<5", "peft>=0.17,<1", "huggingface-hub>=0.36,<1", "safetensors>=0.4", "pyarrow>=16"]

[project.scripts]
training-lab = "training_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
training_lab = ["web/*", "web/vendor/katex/*", "web/vendor/katex/contrib/*", "web/vendor/katex/fonts/*"]
